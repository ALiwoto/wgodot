name: wgodot export templates

on:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: wgodot-export-templates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf8
  SCONS_FLAGS: >-
    production=yes
    debug_symbols=no
    module_text_server_fb_enabled=yes

jobs:
  linux-editor:
    name: Linux editor
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: wgodot-linux-editor
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: ${{ env.SCONS_FLAGS }} accesskit=no

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: wgodot-linux-editor
        continue-on-error: true

      - name: Prepare editor
        run: |
          mkdir -p editor_build release_assets
          cp bin/godot.linuxbsd.editor.x86_64 editor_build/wgodot-linux-editor.x86_64
          strip editor_build/wgodot-linux-editor.x86_64
          chmod +x editor_build/wgodot-linux-editor.x86_64
          tar -czf release_assets/wgodot-linux-editor-x86_64.tar.gz -C editor_build .

      - name: Upload Linux editor
        uses: ./.github/actions/upload-artifact
        with:
          name: wgodot-linux-editor
          path: editor_build/*

      - name: Upload Linux editor to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release_assets/wgodot-linux-editor-x86_64.tar.gz --clobber

  windows-editor:
    name: Windows editor
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: wgodot-windows-editor
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download Direct3D 12 SDK components
        shell: sh
        id: d3d12-sdk
        run: |
          if python ./misc/scripts/install_d3d12_sdk_windows.py; then
            echo "D3D12_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Windows: Direct3D 12 SDK installation failed, building without Direct3D 12 support."
            echo "D3D12_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Download pre-built ANGLE
        shell: sh
        id: angle-sdk
        run: |
          if python ./misc/scripts/install_angle.py; then
            echo "ANGLE_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANGLE SDK installation failed, building without ANGLE support."
            echo "ANGLE_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Download WinRT components
        shell: sh
        run: python ./misc/scripts/install_winrt.py
        continue-on-error: true

      - name: Download pre-built AccessKit
        shell: sh
        id: accesskit-sdk
        run: |
          if python ./misc/scripts/install_accesskit.py; then
            echo "ACCESSKIT_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Windows: AccessKit SDK installation failed, building without AccessKit support."
            echo "ACCESSKIT_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          platform: windows
          target: editor
          scons-flags: >-
            ${{ env.SCONS_FLAGS }}
            windows_subsystem=console
            d3d12=${{ steps.d3d12-sdk.outputs.D3D12_ENABLED }}
            accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }}
            angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }}

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: wgodot-windows-editor
        continue-on-error: true

      - name: Prepare editor
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path editor_build -Force | Out-Null
          New-Item -ItemType Directory -Path release_assets -Force | Out-Null
          Copy-Item bin/godot.windows.editor.x86_64.exe editor_build/wgodot-windows-editor-x86_64.exe
          Compress-Archive -Path editor_build/* -DestinationPath release_assets/wgodot-windows-editor-x86_64.zip -Force

      - name: Upload Windows editor
        uses: ./.github/actions/upload-artifact
        with:
          name: wgodot-windows-editor
          path: editor_build/*

      - name: Upload Windows editor to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload $env:RELEASE_TAG release_assets/wgodot-windows-editor-x86_64.zip --clobber

  android-templates:
    name: Android templates
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: wgodot-android-templates
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download Swappy
        run: python ./misc/scripts/install_swappy_android.py

      - name: Compilation release arm64
        uses: ./.github/actions/godot-build
        with:
          platform: android
          target: template_release
          scons-flags: ${{ env.SCONS_FLAGS }} swappy=yes arch=arm64

      - name: Compilation debug arm64
        uses: ./.github/actions/godot-build
        with:
          platform: android
          target: template_debug
          scons-flags: ${{ env.SCONS_FLAGS }} swappy=yes arch=arm64

      - name: Compilation release arm32
        uses: ./.github/actions/godot-build
        with:
          platform: android
          target: template_release
          scons-flags: ${{ env.SCONS_FLAGS }} swappy=yes arch=arm32

      - name: Compilation debug arm32
        uses: ./.github/actions/godot-build
        with:
          platform: android
          target: template_debug
          scons-flags: ${{ env.SCONS_FLAGS }} swappy=yes arch=arm32

      - name: Compilation release x86_64
        uses: ./.github/actions/godot-build
        with:
          platform: android
          target: template_release
          scons-flags: ${{ env.SCONS_FLAGS }} swappy=yes arch=x86_64

      - name: Compilation debug x86_64
        uses: ./.github/actions/godot-build
        with:
          platform: android
          target: template_debug
          scons-flags: ${{ env.SCONS_FLAGS }} swappy=yes arch=x86_64

      - name: Generate Godot templates
        run: |
          cd platform/android/java
          ./gradlew generateGodotTemplates
          cd ../../..
          ls -l bin/android_*.apk bin/android_source.zip

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: wgodot-android-templates
        continue-on-error: true

      - name: Prepare export templates
        run: |
          mkdir -p export_templates release_assets
          cp bin/android_debug.apk export_templates/android_debug.apk
          cp bin/android_release.apk export_templates/android_release.apk
          cp bin/android_source.zip export_templates/android_source.zip
          tar -czf release_assets/wgodot-android-templates.tar.gz -C export_templates .

      - name: Upload Android templates
        uses: ./.github/actions/upload-artifact
        with:
          name: wgodot-android-templates
          path: export_templates/*

      - name: Upload Android templates to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release_assets/wgodot-android-templates.tar.gz --clobber

  linux-templates:
    name: Linux templates
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: wgodot-linux-templates
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Compilation release
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: template_release
          scons-flags: ${{ env.SCONS_FLAGS }} accesskit=no

      - name: Compilation debug
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: template_debug
          scons-flags: ${{ env.SCONS_FLAGS }} accesskit=no

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: wgodot-linux-templates
        continue-on-error: true

      - name: Prepare export templates
        run: |
          mkdir -p export_templates release_assets
          cp bin/godot.linuxbsd.template_release.x86_64 export_templates/linux_release.x86_64
          cp bin/godot.linuxbsd.template_debug.x86_64 export_templates/linux_debug.x86_64
          chmod +x export_templates/linux_*.x86_64
          tar -czf release_assets/wgodot-linux-templates-x86_64.tar.gz -C export_templates .

      - name: Upload Linux templates
        uses: ./.github/actions/upload-artifact
        with:
          name: wgodot-linux-templates
          path: export_templates/*

      - name: Upload Linux templates to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release_assets/wgodot-linux-templates-x86_64.tar.gz --clobber

  windows-templates:
    name: Windows templates
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: wgodot-windows-templates
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download Direct3D 12 SDK components
        shell: sh
        id: d3d12-sdk
        run: |
          if python ./misc/scripts/install_d3d12_sdk_windows.py; then
            echo "D3D12_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Windows: Direct3D 12 SDK installation failed, building without Direct3D 12 support."
            echo "D3D12_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Download pre-built ANGLE
        shell: sh
        id: angle-sdk
        run: |
          if python ./misc/scripts/install_angle.py; then
            echo "ANGLE_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANGLE SDK installation failed, building without ANGLE support."
            echo "ANGLE_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Download WinRT components
        shell: sh
        run: python ./misc/scripts/install_winrt.py
        continue-on-error: true

      - name: Download pre-built AccessKit
        shell: sh
        id: accesskit-sdk
        run: |
          if python ./misc/scripts/install_accesskit.py; then
            echo "ACCESSKIT_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AccessKit SDK installation failed, building without AccessKit support."
            echo "ACCESSKIT_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Compilation release
        uses: ./.github/actions/godot-build
        with:
          platform: windows
          target: template_release
          scons-flags: >-
            ${{ env.SCONS_FLAGS }}
            d3d12=${{ steps.d3d12-sdk.outputs.D3D12_ENABLED }}
            accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }}
            angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }}

      - name: Compilation debug
        uses: ./.github/actions/godot-build
        with:
          platform: windows
          target: template_debug
          scons-flags: >-
            ${{ env.SCONS_FLAGS }}
            d3d12=${{ steps.d3d12-sdk.outputs.D3D12_ENABLED }}
            accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }}
            angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }}

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: wgodot-windows-templates
        continue-on-error: true

      - name: Prepare export templates
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path export_templates -Force | Out-Null
          New-Item -ItemType Directory -Path release_assets -Force | Out-Null
          Copy-Item bin/godot.windows.template_release.x86_64.exe export_templates/windows_release_x86_64.exe
          Copy-Item bin/godot.windows.template_debug.x86_64.exe export_templates/windows_debug_x86_64.exe
          if (Test-Path bin/godot.windows.template_release.x86_64.console.exe) {
            Copy-Item bin/godot.windows.template_release.x86_64.console.exe export_templates/windows_release_x86_64.console.exe
          }
          if (Test-Path bin/godot.windows.template_debug.x86_64.console.exe) {
            Copy-Item bin/godot.windows.template_debug.x86_64.console.exe export_templates/windows_debug_x86_64.console.exe
          }
          Compress-Archive -Path export_templates/* -DestinationPath release_assets/wgodot-windows-templates-x86_64.zip -Force

      - name: Upload Windows templates
        uses: ./.github/actions/upload-artifact
        with:
          name: wgodot-windows-templates
          path: export_templates/*

      - name: Upload Windows templates to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload $env:RELEASE_TAG release_assets/wgodot-windows-templates-x86_64.zip --clobber

  web-templates:
    name: Web templates
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 4.0.11
          no-cache: true

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: wgodot-web-templates
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Compilation release
        uses: ./.github/actions/godot-build
        with:
          platform: web
          target: template_release
          scons-flags: ${{ env.SCONS_FLAGS }} threads=yes arch=wasm32 use_closure_compiler=yes

      - name: Compilation debug
        uses: ./.github/actions/godot-build
        with:
          platform: web
          target: template_debug
          scons-flags: ${{ env.SCONS_FLAGS }} threads=yes arch=wasm32 use_closure_compiler=yes

      - name: Compilation release without threads
        uses: ./.github/actions/godot-build
        with:
          platform: web
          target: template_release
          scons-flags: ${{ env.SCONS_FLAGS }} threads=no arch=wasm32 use_closure_compiler=yes

      - name: Compilation debug without threads
        uses: ./.github/actions/godot-build
        with:
          platform: web
          target: template_debug
          scons-flags: ${{ env.SCONS_FLAGS }} threads=no arch=wasm32 use_closure_compiler=yes

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: wgodot-web-templates
        continue-on-error: true

      - name: Prepare export templates
        run: |
          mkdir -p export_templates release_assets
          cp bin/godot.web.template_release.wasm32.zip export_templates/web_release.zip
          cp bin/godot.web.template_debug.wasm32.zip export_templates/web_debug.zip
          cp bin/godot.web.template_release.wasm32.nothreads.zip export_templates/web_nothreads_release.zip
          cp bin/godot.web.template_debug.wasm32.nothreads.zip export_templates/web_nothreads_debug.zip
          tar -czf release_assets/wgodot-web-templates-wasm32.tar.gz -C export_templates .

      - name: Upload Web templates
        uses: ./.github/actions/upload-artifact
        with:
          name: wgodot-web-templates
          path: export_templates/*

      - name: Upload Web templates to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release_assets/wgodot-web-templates-wasm32.tar.gz --clobber
